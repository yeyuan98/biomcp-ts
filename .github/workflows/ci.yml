# CI gate pipeline for biomcp-ts
#
# Runs on every pull_request and on pushes to main. The job id (`ci`) doubles as
# the status-check name — the branch ruleset requires exactly this check before
# merging, which is also what makes dependabot auto-merge safe (see
# docs/development/CI.md).
#
# Note: full `npm audit` (not --omit=dev) is intentional. This repo bundles
# runtime code from devDependencies into dist/bundle.js (e.g. fast-xml-parser),
# so "dev-only" advisories can be production vulnerabilities.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile-exact)
        run: npm ci --no-fund

      - name: Typecheck (src + scripts)
        run: make typecheck

      - name: Unit tests (mocked; integration excluded by npm test)
        run: npm test

      # Keyless live-API suites (jest.integration.config.ts, --runInBand).
      # Env-gated suites (db, biowasm/ranalysis mirror, depmap) self-skip via
      # describe.skip when their env vars are absent, so no CI gating is needed.
      - name: Integration tests (live keyless APIs; env-gated suites self-skip)
        run: npm run test:integration

      - name: Build bundles
        run: npm run build

      - name: Dependency audit (full — see header note)
        run: |
          # Full audit (dev deps included) minus one documented exception:
          # GHSA-hp3w-g68c-fv3c (sprintf-js DoS) — sprintf-js is abandoned
          # upstream (every version vulnerable, no patch exists) and is
          # reachable only inside jest's @istanbuljs/load-nyc-config ->
          # js-yaml@3 -> argparse@1 error-formatting path: test tooling
          # that is never bundled into dist and never sees untrusted input.
          # Remove this allowlist entry once a patched release exists.
          npm audit --audit-level=low --json | node -e '
            const a = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const allow = new Set(["GHSA-hp3w-g68c-fv3c"]);
            const bad = [];
            for (const v of Object.values(a.vulnerabilities ?? {})) {
              for (const via of v.via ?? []) {
                if (typeof via === "object" && !allow.has(via.url.split("/").pop())) {
                  bad.push(`${via.title} (${via.name} ${via.range}) ${via.url}`);
                }
              }
            }
            const totals = a.metadata?.vulnerabilities?.total ?? 0;
            console.log(`audit: ${totals} total (allowlisted: GHSA-hp3w-g68c-fv3c)`);
            if (bad.length) {
              console.error(`\n${bad.length} non-allowlisted vulnerabilit${bad.length === 1 ? "y" : "ies"}:\n` + bad.join("\n"));
              process.exit(1);
            }
          '

      - name: MCP stdio handshake smoke (NDJSON framing)
        run: |
          req='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}'
          out=$({ echo "$req"; sleep 2; } | timeout 15 node dist/bundle.js)
          echo "$out" | grep -q '"serverInfo"'
