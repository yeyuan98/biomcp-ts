# CI gate pipeline for biomcp-ts
#
# Runs on every pull_request and on pushes to main. Two parallel jobs:
#
# - `ci` — the required gate (the job id doubles as the status-check name the
#   branch ruleset requires; do not rename it). Typecheck → unit → build →
#   audit → smoke. Also what makes dependabot auto-merge safe (see
#   docs/development/CI.md).
# - `integration` — the advisory tier, two steps since issue #164:
#   1. the GATING step runs every live-API suite EXCEPT two known
#      GitHub-runner offenders, still with NO continue-on-error, so a
#      failure renders as a red ✗ named `integration` in the checks list
#      (visible, impossible to miss) but the check is NOT required, so it
#      never blocks merge. Failures must be triaged per the rubric in
#      docs/development/CI.md.
#   2. the BEST-EFFORT step runs ONLY the two offenders (Ensembl REST +
#      arXiv — shared runner IPs get throttled by those upstreams) with
#      continue-on-error: their intermittent flakes stay visible (own log
#      artifact + a step-summary section labeled non-gating) but can never
#      fail the job.
#   Local runs are unaffected and authoritative: `make test-integration`
#   runs and fails on every suite, offenders included.
#
# Note: full `npm audit` (not --omit=dev) is intentional. This repo bundles
# runtime code from devDependencies into dist/bundle.js (e.g. fast-xml-parser),
# so "dev-only" advisories can be production vulnerabilities.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile-exact)
        run: npm ci --no-fund

      - name: Typecheck (src + scripts)
        run: make typecheck

      - name: Unit tests (mocked; integration excluded by npm test)
        run: npm test

      - name: Build bundles
        run: npm run build

      - name: Dependency audit (full — see header note)
        run: npm audit --audit-level=low

      - name: MCP stdio handshake smoke (NDJSON framing)
        run: |
          req='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}'
          out=$({ echo "$req"; sleep 2; } | timeout 15 node dist/bundle.js)
          echo "$out" | grep -q '"serverInfo"'

  # Advisory tier — see the workflow header and docs/development/CI.md.
  # Runs in parallel with `ci` (no `needs`); deliberately NOT a required
  # status check, so a red `integration` never blocks merge — but failures
  # are impossible to overlook (red ✗ + step summary + log artifact) and
  # MUST be triaged before merging.
  #
  # Two-tier contract (issue #164): the gating step runs every suite EXCEPT
  # the two known GitHub-runner offenders below; those two run separately,
  # best-effort and non-gating. LOCAL RUNS ARE UNCHANGED AND AUTHORITATIVE —
  # `npm run test:integration` / `make test-integration` still runs and fails
  # on every suite; the split exists only on GitHub-hosted runners.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile-exact)
        run: npm ci --no-fund

      # Keyless live-API suites (jest.integration.config.ts, --runInBand).
      # Env-gated suites (db, biowasm/ranalysis mirror, depmap) self-skip via
      # describe.skip when their env vars are absent. NO continue-on-error
      # here on purpose: jest's exit code must fail this job so the checks
      # list shows a red ✗ named `integration`.
      #
      # === KNOWN OFFENDERS — pinned exclusion list (issues #164, #182) ===
      # Exactly these four paths, NO others:
      #   - src/__tests__/integration/tools/ensembl-tools.test.ts
      #     (Ensembl REST throttles shared GitHub runner IPs)
      #   - src/__tests__/integration/tools/article-tools.test.ts
      #     (arXiv cases: searchArxiv TimeoutError from runner IPs)
      #   - src/__tests__/integration/tools/gene-tools.test.ts
      #     (gene_articles BRCA1: article-source legs return pmid-less rows
      #     from runner IPs; 4 occurrences 2026-10-18/19, triage in #182)
      #   - src/__tests__/integration/tools/drug-tools.test.ts
      #     (openfda api.fda.gov transient 500s, retryable; triage in #182)
      # All are environmental flakes: per-run-varying subsets, green locally
      # and on rerun. 2026-10-19 maintainer decision (#182): confirmed
      # unstable upstreams go on this list instead of burning reruns.
      # ANY addition to this list requires (1) a GitHub issue with triage
      # evidence per the rubric in docs/development/CI.md and (2) an explicit
      # maintainer decision — a new flaky suite still gates and gets triaged
      # like any other failure. Keep this list from growing into a blind spot.
      - name: Integration tests (gating — known offenders excluded)
        shell: bash # explicit bash => -eo pipefail; the set below is belt-and-braces
        run: |
          set -o pipefail # else tee masks jest's exit code and failures hide again
          npm run test:integration -- \
            --testPathIgnorePatterns \
              src/__tests__/integration/tools/ensembl-tools.test.ts \
              src/__tests__/integration/tools/article-tools.test.ts \
              src/__tests__/integration/tools/gene-tools.test.ts \
              src/__tests__/integration/tools/drug-tools.test.ts \
            2>&1 | tee integration.log

      # Best-effort run of ONLY the four known offenders (pinned list above).
      # continue-on-error ON PURPOSE: runner-IP flakes in exactly these four
      # files must not fail the advisory job. `if: always()` so they still
      # run — and stay visible in the log/summary/artifact — even when the
      # gating step failed; their status is orthogonal to it.
      - name: Integration tests (known offenders — non-gating, best-effort)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail # keep jest's real exit code visible in the log/summary even though this step cannot fail the job
          npm run test:integration -- \
            --runTestsByPath \
              src/__tests__/integration/tools/ensembl-tools.test.ts \
              src/__tests__/integration/tools/article-tools.test.ts \
              src/__tests__/integration/tools/gene-tools.test.ts \
              src/__tests__/integration/tools/drug-tools.test.ts \
            2>&1 | tee known-offenders.log

      # Runs on failure AND success: the all-green verdict is worth recording
      # too. Appends the verdict + failed-test table + triage rubric for the
      # gating log, then the same treatment for the known-offenders log,
      # labeled non-gating (scripts/ci/integration-summary.ts never throws).
      - name: Integration failure summary
        if: always()
        run: |
          node --import tsx scripts/ci/integration-summary.ts integration.log
          node --import tsx scripts/ci/integration-summary.ts known-offenders.log \
            --title "Known-offender tier (non-gating)" \
            --artifact known-offenders-log \
            --non-gating

      # Full raw jest output for reviewers (retained per repo artifact policy).
      - name: Upload integration log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-log
          path: integration.log

      # Known-offender log uploads on every run, green included — issue #164
      # wants their status visible, not only on failure.
      - name: Upload known-offenders log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: known-offenders-log
          path: known-offenders.log
