# Daily maintenance stats for README badges, served from the orphan single-commit
# badge-stats branch (stats.json at its root) via shields.io dynamic/json badges.
# The repository ruleset requires PR + ci status for main, which no bot push can
# satisfy (GITHUB_TOKEN PRs do not trigger ci), so main is never touched: each run
# force-replaces badge-stats with one fresh orphan commit — no history growth, no
# rebase logic, and non-default branches are outside the ruleset's scope.
# commits30d excludes this workflow's own bot commits (they would otherwise inflate
# the rolling-30d count by ~30/month).

name: stats-badges

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-badges
  cancel-in-progress: false

jobs:
  update:
    # workflow_dispatch can target any ref; only ever act on main so a
    # branch-selected dispatch can never publish anything unexpected
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute stats
        run: |
          set -euo pipefail
          ytd_start=$(date -u +%Y-01-01)
          ytd_end=$(date -u -d "yesterday" +%F)
          if [[ "$ytd_start" > "$ytd_end" ]]; then ytd_end=$ytd_start; fi
          ytd=$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 \
            "https://api.npmjs.org/downloads/range/${ytd_start}:${ytd_end}/biomcp" \
            | jq '[.downloads[].downloads] | add // 0')
          since=$(date -u -d "30 days ago" +%Y-%m-%dT%H:%M:%SZ)
          total=$(git rev-list --count --since="$since" HEAD)
          bot=$(git rev-list --count --since="$since" --author='github-actions' HEAD)
          commits30d=$((total - bot))
          comma() { sed -e ':a' -e 's/\B[0-9]\{3\}\>/,&/' -e 'ta' <<< "$1"; }
          jq -n --arg ytd "$(comma "$ytd")" --arg commits30d "$(comma "$commits30d")" \
            '{ytd: $ytd, commits30d: $commits30d}' > "$RUNNER_TEMP/stats.json"
          cat "$RUNNER_TEMP/stats.json"

      - name: Publish stats to badge-stats branch
        run: |
          set -euo pipefail
          stats="$RUNNER_TEMP/stats.json"
          git fetch --force origin refs/heads/badge-stats:refs/remotes/origin/badge-stats || true
          if [ "$(git show refs/remotes/origin/badge-stats:stats.json 2>/dev/null || true)" = "$(cat "$stats")" ]; then
            echo "stats unchanged; nothing to publish"
            exit 0
          fi
          blob=$(git hash-object -w "$stats")
          export GIT_INDEX_FILE="$RUNNER_TEMP/stats-index"
          git read-tree --empty
          git update-index --add --cacheinfo 100644,"$blob",stats.json
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          commit=$(GIT_AUTHOR_NAME=github-actions[bot] \
                   GIT_AUTHOR_EMAIL=41898282+github-actions[bot]@users.noreply.github.com \
                   GIT_COMMITTER_NAME=github-actions[bot] \
                   GIT_COMMITTER_EMAIL=41898282+github-actions[bot]@users.noreply.github.com \
                   git commit-tree "$tree" -m "chore(badges): refresh stats [skip ci]" \
                     -m "- npm downloads YTD: $(jq -r .ytd "$stats")
          - commits (rolling 30d, bot-excluded): $(jq -r .commits30d "$stats")")
          for attempt in 1 2 3; do
            if git push --force origin "$commit:refs/heads/badge-stats"; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          echo "push failed after 3 attempts"
          exit 1
